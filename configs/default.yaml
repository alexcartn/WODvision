# Configuration par defaut de WODVision.
# Toute valeur ici est surchargeable en ligne de commande.

calibration:
  plate_diameter_mm: 450.0
  min_ellipse_ratio: 0.9

signal:
  resample_fps: 60.0
  max_gap_frames: 5
  butterworth_order: 4
  butterworth_cutoff_hz: 6.0
  min_keypoint_confidence: 0.3

rep_segmentation:
  peak_prominence_fraction: 0.5
  min_rep_distance_s: 0.5

squat:
  depth_margin_px: 5.0
  lockout_angle_deg: 165.0

pose:
  backend: rtmlib
  mode: balanced

tracking:
  max_occlusion_frames: 15

camera_motion:
  enabled: true
  analysis_width_px: 640
  max_features: 300
  min_inliers: 12
  bbox_margin_fraction: 0.15

# Aviron (ergometre Concept2, vue de profil). Seuils = hypotheses de depart,
# a calibrer sur videos annotees (voir docs/rowing_concept.md).
rowing:
  analysis_fps: 30.0
  inference_max_width: 960
  detect_every_n_frames: 8
  bbox_from_pose_margin: 0.25
  cutoff_hz: 6.0
  stroke_prominence_fraction: 0.35
  min_stroke_period_s: 1.2
  min_stroke_rate_spm: 10.0
  max_stroke_rate_spm: 50.0
  phase_onset_fraction: 0.1
  min_leg_range_deg: 20.0
  min_trunk_range_deg: 10.0
  min_arm_range_deg: 30.0
  flagged_stroke_fraction: 0.3
  min_leg_fraction_at_trunk_onset: 0.4
  min_leg_fraction_at_arm_onset: 0.75
  max_shin_beyond_vertical_deg: 5.0
  max_layback_deg: 35.0
  min_layback_deg: 5.0
  min_handle_height_at_catch: -0.25
  max_handle_height_at_finish: 0.75
  max_chain_angle_deg: 8.0
  max_knee_break_fraction: 0.25
  min_recovery_drive_ratio: 1.3
  max_trunk_drift_deg: 6.0
  max_view_shoulder_ratio: 0.5
  view_frontal_ratio: 1.1
  max_travel_loss_pct: 15.0
  max_rate_cv_pct: 12.0

# Couplage PM5 (Concept2). Seuils de courbe de force = hypotheses de depart (guide Concept2 :
# courbe lisse ; pic precoce = catch explosif ; plusieurs pics = transition jambes/dos/bras).
pm5:
  record_phase: auto
  max_lag: 12
  ambiguity_confidence: 0.5
  min_period_std_s: 0.05
  phase_tolerance_s: 0.3
  peak_early_pos: 0.2
  multipeak_prominence: 0.15
  min_force_points: 8
  force_curve_points: 100

# Mode fantome : posture de reference superposee (hypotheses tirees des consignes Concept2).
ghost:
  enabled: true
  lean_catch_deg: -35.0
  lean_finish_deg: 25.0
  shin_catch_deg: 0.0
  leg_end: 0.7
  trunk_onset: 0.45
  trunk_end: 0.9
  arm_onset: 0.8
  knee_break: 0.6
  leg_straight_fraction: 0.98
